name: Tests and packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s library/tests -v
      - run: uv run python -m unittest discover -s cli/tests -v
      - run: uv run --with websockets==17.0.1 python -m unittest discover -s research -v
      - run: uv build --package catch-control && uv build --package catch-control-cli
      - run: uv run python tools/build_ha.py
      - run: git diff --exit-code -- home-assistant/custom_components/catch_control/_vendor
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f home-assistant/Dockerfile.test -t catch-control-ha-test home-assistant
      - run: docker run --rm --mount "type=bind,source=$PWD/home-assistant,target=/workspace,readonly" catch-control-ha-test
