[project]
name = "catch-control"
version = "0.2.1"
description = "Reusable local Bluetooth client for CATCH Control"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["bleak>=2,<4", "construct>=2.10.70,<2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catch_control"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/LICENSE"]
exclude = ["**/__pycache__", "**/*.pyc"]
