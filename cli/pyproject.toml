[project]
name = "catch-control-cli"
version = "0.2.0"
description = "CLI for the catch-control Python library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["catch-control==0.2.0"]

[project.scripts]
catch-control = "catch_control_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catch_control_cli"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/LICENSE"]
exclude = ["**/__pycache__", "**/*.pyc"]
